<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>بیلتو | مدیریت ساخت‌وساز</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>

.qk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 14px}.qk a{text-align:center;font-size:12px}.qk i{display:grid;place-items:center;height:58px;border-radius:16px;background:var(--li);font-size:26px;font-style:normal;margin-bottom:4px}
.bn{background:linear-gradient(120deg,#1a62f0,#0b46b8);color:#fff;border-radius:18px;padding:16px;margin-bottom:14px;position:relative;overflow:hidden}.bn:after{content:"🏡";position:absolute;left:10px;bottom:-8px;font-size:70px}.bn p{margin:2px 0 10px;font-size:12px;opacity:.9}.bn a{background:#fff;color:var(--pr);border-radius:10px;padding:5px 16px;font-size:12px;font-weight:700;display:inline-block}
.c{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:12px;box-shadow:0 4px 12px rgba(11,42,91,.06);margin-bottom:12px;display:block}
.it{display:flex;gap:12px;align-items:center}.it .g{flex:1;min-width:0}.th{width:64px;height:64px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,#dbe7fb,#b7cdf3)}
.t1{background:repeating-linear-gradient(90deg,#333 0 5px,#555 5px 10px)}.t2{background:linear-gradient(135deg,#4a7fe0,#9fc0f5)}.t3{background:repeating-linear-gradient(0deg,#c8663a 0 9px,#e9a07a 9px 11px)}
.pr{color:var(--pr);font-weight:700;font-size:12px}

#nv a{font-size:11px;color:var(--mu);text-align:center;flex:1}#nv a.on{color:var(--pr);font-weight:700}#nv a span{display:block;font-size:21px}

.tabs{display:flex;border-bottom:1px solid var(--bd);margin:10px 0 14px}.tabs a{flex:1;text-align:center;padding:7px 0;color:var(--mu)}.tabs a.on{color:var(--pr);font-weight:700;border-bottom:2px solid var(--pr)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:4px 0 14px;scrollbar-width:none}.chips a{background:var(--li);color:var(--pr);border-radius:20px;padding:3px 16px;white-space:nowrap}.chips a.on{background:var(--pr);color:#fff}
.ring{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;flex:none}.ring b{width:70px;height:70px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:19px;color:var(--pr)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tot{background:var(--li);border-radius:14px;padding:12px;text-align:center;margin-top:12px}.tot b{font-size:20px;color:var(--pr)}
.sel{display:flex;gap:12px;align-items:center;border:1.5px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:12px;font-weight:700;cursor:pointer}.sel.on{border-color:var(--pr);background:var(--li)}.sel i{margin-inline-start:auto;font-style:normal;font-size:32px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 4px;text-align:right;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:600}.ok{color:#16a06a}.no{color:#e03a3a}.wr{color:#e08a00}
.seg{display:flex;background:var(--li);border-radius:12px;padding:3px;margin:10px 0 14px}.seg a{flex:1;text-align:center;padding:7px;border-radius:10px;color:var(--mu)}.seg a.on{background:var(--pr);color:#fff}
.res{border:1px solid var(--bd);border-radius:14px;padding:12px;margin-top:14px}.res .big{font-size:21px;font-weight:800;color:var(--pr)}
.stat{display:flex;justify-content:space-around;text-align:center;margin:12px 0}.stat b{font-size:18px;color:var(--pr);display:block}
.pj{display:flex;gap:8px;margin:10px 0}.pj div{flex:1;height:78px;border-radius:12px;display:grid;place-items:center;font-size:34px;background:linear-gradient(135deg,#dbe7fb,#9fc0f5)}
details{border-bottom:1px solid var(--bd);padding:12px 0}summary{cursor:pointer;font-weight:600}details p{margin:6px 0 0;color:var(--mu);font-size:13px}
.ls a{display:flex;justify-content:space-between;padding:14px 2px;border-bottom:1px solid var(--bd)}
.av{width:78px;height:78px;border-radius:50%;margin:10px auto 6px;background:linear-gradient(135deg,#dbe7fb,#9fc0f5);display:grid;place-items:center;font-size:40px}
.dr{min-height:100%;background:var(--nv);color:#fff;padding:18px;position:relative;overflow:auto}.dr a{display:flex;gap:12px;padding:14px 4px;border-bottom:1px solid rgba(255,255,255,.08)}.dr .pm{margin-top:24px;background:linear-gradient(120deg,#1a62f0,#0b46b8);border-radius:16px;padding:16px;font-weight:700}
.st{display:flex;gap:10px;padding:6px 0;align-items:center}.dot{width:26px;height:26px;border-radius:50%;background:var(--li);color:var(--pr);display:grid;place-items:center;font-size:12px;flex:none}.dot.d{background:#16a06a;color:#fff}.dot.c{background:var(--pr);color:#fff}
.tag{background:var(--li);color:var(--pr);border-radius:20px;padding:1px 10px;font-size:11px}
#ts{position:absolute;bottom:80px;inset-inline:18px;background:var(--nv);color:#fff;border-radius:12px;padding:10px 14px;text-align:center;opacity:0;transition:.3s;pointer-events:none;z-index:9}#ts.on{opacity:1}

/* Responsive layouts */
#pg{min-width:0;overscroll-behavior:contain}.c{min-width:0}.c:has(table){overflow-x:auto}table{min-width:340px}
@media(max-width:370px){#pg{padding-inline:12px}.qk{gap:4px}.qk a{font-size:10px}.it{gap:8px}.it .btn{white-space:nowrap}.otp{gap:4px}.otp input{width:40px}}
@media(min-width:600px){body{padding:20px}#app{width:100%;max-width:760px;max-height:none;height:calc(100dvh - 40px);border-radius:24px}#pg{padding:28px 36px 36px}#nv{padding:10px 14px}#nv a{font-size:13px}.qk{gap:16px}.qk i{height:74px}.hero{padding:36px}.hero h1{font-size:40px}.hero svg{max-width:420px;margin:auto}.hero .btn{max-width:360px}.hero p.ctr{max-width:360px}#pg[data-page=signup]>.ctr,#pg[data-page=login]>.ctr,#pg[data-page=otp]>.ctr,#pg[data-page=onboard]>.ctr{max-width:480px;margin:0 auto}.dr{padding:32px 40px}}
@media(min-width:1024px){#app{max-width:1120px}#pg{padding:36px 56px 44px}#pg[data-page=landing] .hero{padding:52px 72px}#pg[data-page=landing] .hero h1{font-size:48px}#pg[data-page=landing] .hero p{max-width:550px}.qk i{height:84px}.bn{padding:24px}#nv{justify-content:center}#nv a{max-width:180px}.dr{padding-inline:64px}}
@media(max-height:500px) and (orientation:landscape){body{padding:0}#app{height:100dvh;border-radius:0}#nv{padding:3px}#nv a span{font-size:16px}#nv .pl{width:38px;height:38px;margin-top:0}}
</style></head><body>
<div id="app"><div id="pg"></div><div id="nv"></div><div id="ts"></div></div>
<script>
const $=s=>document.querySelector(s),fa=n=>Math.round(n).toLocaleString('fa-IR'),num=s=>+String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))||0;
const go=h=>{location.hash=h};let tt;
function toast(m){const t=$('#ts');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}
const ST=['خرید زمین','نقشه و مجوز','فونداسیون','اسکلت','سقف و دیوار','تأسیسات','نازک‌کاری','نما و تحویل'];
const RATE={'سازه بتنی':9.25e6,'اسکلت فلزی':8.6e6,'سازه ترکیبی':8e6};
const M=[['میلگرد آجدار ۱۴','کیلو',24500,'آهن‌آلات','t1'],['سیمان تیپ ۲','کیسه',145000,'سیمان','t2'],['تیرآهن ۶۰/۷۰','تن',58000000,'آهن‌آلات','t1'],['آجر سفال','عدد',5000,'بلوک و آجر','t3'],['بلوک سبک','عدد',22000,'بلوک و آجر','t3'],['شن و ماسه','تن',210000,'دیگر','t2']];
const CATS=['همه','آهن‌آلات','سیمان','بلوک و آجر','دیگر'];
const BR=[['ذوب آهن اصفهان',1,'موجود'],['فولاد مبارکه',1.029,'موجود'],['میانه',1.016,'کم'],['ظفر باب',1.053,'موجود'],['کاوه',1.06,'ناموجود']];
const C=[['شرکت عمران پارس','سفت‌کاری','۴٫۸','۲۵','۱۲'],['گروه ساختمانی آریا','نقاشی','۴٫۷','۲۲','۸'],['شرکت سازه مدرن','برق و تأسیسات','۴٫۶','۴۸','۱۰'],['گروه نمای نو','سفت‌کاری','۴٫۵','۱۷','۷']];
const CT=['همه','سفت‌کاری','نقاشی','برق و تأسیسات'];
const ART=[['مراحل ساخت خانه از صفر تا صد','🏗'],['راهنمای خرید میلگرد استاندارد','⚫'],['نکات مهم خرید و ذخیره سیمان','🧱'],['چگونه پیمانکار مناسب انتخاب کنیم؟','👷']];
const FAQ=[['چطور قیمت مصالح را مشاهده کنم؟','از بخش «قیمت مصالح» جستجو یا فیلتر کنید.'],['آیا استعلام قیمت به‌صورت کلی وجود دارد؟','قیمت‌ها نمایشی و تقریبی هستند.'],['چطور پیمانکار مناسب انتخاب کنم؟','امتیاز، سابقه و تخصص را مقایسه کنید.'],['هزینه ساخت به چه عواملی بستگی دارد؟','متراژ، شهر، کیفیت مصالح و نوع پروژه.'],['آیا برای پروژه‌های تجاری هم خدمات دارید؟','بله، پروژه تجاری و صنعتی هم پشتیبانی می‌شود.']];
const S={ob:0,tab:0,cat:'همه',q:'',cs:'همه',cq:'',fq:'',gq:'',type:'مسکونی',mat:0,sz:0,br:'همه',cur:1,
 cl:{mode:0,area:200,struct:'سازه بتنی',fl:2,res:1},
 projects:[{id:1,name:'خانه ویلایی',type:'مسکونی',city:'تهران، ایران',area:200,floors:2,stage:2,pct:70,struct:'سازه بتنی'}]};
try { const saved=JSON.parse(localStorage.getItem('bilto-demo-v1')||'null'); if(saved && Array.isArray(saved.projects) && saved.projects.length) Object.assign(S,saved); } catch(e) {}
const save=()=>{try{localStorage.setItem('bilto-demo-v1',JSON.stringify({projects:S.projects,cur:S.cur,in:S.in,cl:S.cl}))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cur=()=>S.projects.find(p=>p.id==S.cur)||S.projects[0];
const total=p=>p.area*RATE[p.struct||'سازه بتنی'];
const brk=t=>({m:t*1200/1850,l:t*400/1850,o:t*250/1850});
const L=w=>`<span class="lg" ${w?'style="color:#fff"':''} onclick="go('${S.in?'dash':'landing'}')">بیلتو<i>⌂</i></span>`,LB=`<div class="lgb">${L()}</div>`;
const pageTop=t=>`<div class="tb"><button class="m" onclick="go('menu')">⋮</button>${L()}</div><h2>${t}</h2>`;
const srch=(ph,v,fn)=>`<input class="sr" placeholder="🔍 ${ph}" value="${v}" oninput="${fn}(this.value)">`;
const chips=(a,c,fn)=>`<div class="chips">${a.map(x=>`<a class="${x==c?'on':''}" onclick="${fn}('${x}')">${x}</a>`).join('')}</div>`;
const star=r=>`<span style="color:#e0a000">★★★★★</span> <span class="mu">${r}</span>`;
const hero=`<svg viewBox="0 0 300 260"><g stroke="#cfe0ff" stroke-width="2" fill="none"><path d="M60 260V60M80 260V60M60 80h20M60 110h20M60 140h20M60 170h20M60 200h20"/><path d="M20 60h200M70 60L30 60M70 60l70-36 80 36M150 60v70"/><path d="M200 260V150h60v110M205 170h50M205 200h50"/></g></svg>`;
const cc=(c,i)=>`<a class="c it" href="#cp${i}"><div class="th">🏗</div><div class="g"><b>${c[0]}</b><div class="mu">${c[1]}</div><div>${star(c[2])}</div><div class="mu">${c[3]} پروژه انجام شده</div></div><span class="btn o" style="width:auto;padding:5px 12px;font-size:11px">مشاهده پروفایل</span></a>`;
const mlist=()=>M.map((m,i)=>[m,i]).filter(([m])=>(S.cat=='همه'||m[3]==S.cat)&&m[0].includes(S.q)).map(([m,i])=>`<a class="c it" onclick="S.mat=${i};S.sz=0;S.br='همه';go('compare')"><div class="th ${m[4]}"></div><div class="g"><b>${m[0]}</b><div class="pr">${m[1]} / ${fa(m[2])} تومان</div></div><span class="mu">‹</span></a>`).join('')||'<p class="ctr mu">موردی پیدا نشد</p>';
const clist=()=>C.map((c,i)=>[c,i]).filter(([c])=>(S.cs=='همه'||c[1]==S.cs)&&c[0].includes(S.cq)).map(([c,i])=>cc(c,i)).join('')||'<p class="ctr mu">موردی پیدا نشد</p>';
const flist=()=>FAQ.filter(f=>f[0].includes(S.fq)).map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join('')||'<p class="ctr mu">موردی پیدا نشد</p>';
const alist=()=>ART.filter(a=>a[0].includes(S.gq)).map(a=>`<a class="c it" onclick="toast('مقاله نمایشی است')"><div class="th">${a[1]}</div><div class="g"><b>${a[0]}</b><div class="mu">۵ دقیقه مطالعه</div></div></a>`).join('')||'<p class="ctr mu">موردی پیدا نشد</p>';
const up=id=>fn=>{$('#'+id).innerHTML=fn()};
const sq=v=>{S.q=v;$('#lst').innerHTML=mlist()},cq=v=>{S.cq=v;$('#lst').innerHTML=clist()},fq=v=>{S.fq=v;$('#lst').innerHTML=flist()},gq=v=>{S.gq=v;$('#lst').innerHTML=alist()};
const sc=c=>{S.cat=c;R(1)},cs=c=>{S.cs=c;R(1)},stab=i=>{S.tab=i;R(1)};
const P={
landing:()=>({h:`<div class="hero">${hero}<div class="tb">${L(1)}<span>☰</span></div><h1>از زمین تا خانه،<br>با خیال راحت بساز!</h1><p>همه‌چیز برای ساخت در یکجا: قیمت مصالح، برآورد هزینه، پیمانکاران نمونه و راهنمای کامل ساخت.</p><a class="btn" onclick="go('signup')">شروع کنید</a><p class="ctr" style="margin:14px 0 0"><a onclick="go('login')">ورود به حساب کاربری</a></p></div>`,full:1}),
signup:()=>({h:`<div class="ctr">${LB}<h2 style="margin-top:18px">ثبت‌نام</h2><p class="mu">نسخه نمایشی است؛ پیامک واقعی ارسال نمی‌شود.</p><div class="ph"><b>+۹۸ ⌄</b><input id="ph" class="in" inputmode="tel" placeholder="شماره موبایل"></div><a class="btn" onclick="chk('signup')">ارسال کد تأیید</a><p class="mu" style="margin-top:12px">با ثبت‌نام، شما با قوانین و مقررات موافقت می‌کنید.</p><div class="ill">🏠</div></div>`,full:1}),
otp:()=>({h:`<div class="ctr">${LB}<h2 style="margin-top:18px">کد تایید</h2><p class="mu">کد نمایشی از پیش وارد شده است؛ پیامکی ارسال نمی‌شود.</p><div class="otp">${[1,2,3,4,5].map((n,i)=>`<input maxlength="1" inputmode="numeric" value="${n}" oninput="if(this.value&&this.nextElementSibling)this.nextElementSibling.focus()" onkeydown="if(event.key=='Backspace'&&!this.value&&this.previousElementSibling)this.previousElementSibling.focus()">`).join('')}</div><p class="mu">ارسال مجدد کد (۰:۵۸)</p><a class="btn" style="margin-top:16px" onclick="chk('otp')">تایید</a></div>`,full:1}),
login:()=>({h:`<div class="ctr">${LB}<h2 style="margin-top:18px">ورود به حساب کاربری</h2><p class="mu">شماره موبایل خود را وارد کنید.</p><div class="ph"><b>+۹۸ ⌄</b><input id="ph" class="in" inputmode="tel" placeholder="شماره موبایل"></div><a class="btn" onclick="chk('login')">ورود</a><p style="margin-top:14px"><a class="mu" style="color:var(--pr)" onclick="go('signup')">حساب کاربری ندارید؟ ثبت‌نام</a></p></div>`,full:1}),
onboard:()=>{const s=S.ob,t=[['🏡','راهنمای قدم‌به‌قدم ساخت','با اطلاعات دقیق و ساده، از خرید زمین تا تحویل پروژه همراه شما هستیم.'],['🧱','قیمت و مقایسه مصالح','قیمت‌های نمایشی مصالح را ببینید و برندها را مقایسه کنید.'],['🧮','برآورد هزینه ساخت','هزینه پروژه را بر اساس متراژ و نوع سازه برآورد کنید.'],['👷','پیمانکاران نمونه','متخصصان مناسب پروژه‌تان را پیدا کنید.']][s];return{h:`<div class="ctr"><div class="ob">${t[0]}</div><h2>${t[1]}</h2><p class="mu">${t[2]}</p><div class="dots">${[0,1,2,3].map(i=>i==s?'<b>●</b>':'●').join(' ')}</div><a class="btn" onclick="${s==3?"S.ob=0;S.in=1;go('dash')":'S.ob++;R()'}">${s==3?'شروع':'بعدی'}</a><p style="margin-top:12px"><a class="mu" onclick="S.ob=0;S.in=1;go('dash')">رد کردن</a></p></div>`,full:1}},
dash:()=>{const p=cur();return{n:0,h:`<div class="row" style="margin-bottom:8px"><a onclick="go('notif')" style="font-size:20px">🔔</a><div style="flex:1;margin:0 10px"><b>سلام، محمد!</b><div class="mu">به بیلتو خوش آمدید</div></div>${L()}</div><input class="sr" placeholder="🔍 جستجوی مصالح، قیمت‌ها و ..." onkeydown="if(event.key=='Enter'){S.q=this.value;go('prices')}"><div class="qk"><a onclick="go('guide')"><i>📖</i>راهنما</a><a onclick="go('calc')"><i>🧮</i>برآورد هزینه</a><a onclick="go('prices')"><i>🏷️</i>قیمت مصالح</a><a onclick="go('projects')"><i>📁</i>پروژه‌ها</a></div><div class="bn"><b>ساخت خانه رویایی‌تان با بیلتو</b><p>ساده‌تر، شفاف‌تر و مطمئن‌تر</p><a onclick="go('new')">شروع پروژه جدید</a></div><div class="row" style="margin-bottom:8px"><b>پروژه‌های من</b><a class="mu" onclick="go('projects')">همه</a></div>${S.projects.map(p=>`<a class="c it" onclick="S.cur=${p.id};S.tab=0;go('project')"><div class="th">🏠</div><div class="g"><b>${esc(p.name)}</b><div class="mu">${ST[p.stage]} · ${fa(p.pct)}٪</div></div><span class="mu">‹</span></a>`).join('')}`}},
new:()=>({n:1,h:`${pageTop('ایجاد پروژه جدید')}<p class="mu">نوع پروژه را انتخاب کنید</p>${[['مسکونی','خانه مسکونی','🏠'],['تجاری','ساختمان تجاری','🏢'],['صنعتی','پروژه صنعتی','🏭']].map(x=>`<div class="sel ${S.type==x[0]?'on':''}" onclick="S.type='${x[0]}';R(1)">${x[1]}<i>${x[2]}</i></div>`).join('')}<a class="btn" onclick="go('info')">ادامه</a>`}),
info:()=>({n:1,h:`${pageTop('اطلاعات پروژه')}<label>نام پروژه</label><input class="in" id="n" value="خانه ویلایی"><label>موقعیت پروژه</label><input class="in" id="c" value="تهران، ایران"><label>متراژ (مترمربع)</label><input class="in" id="a" inputmode="numeric" value="200"><label>تعداد طبقات</label><input class="in" id="f" inputmode="numeric" value="2"><a class="btn" onclick="addP()">ادامه و ثبت</a>`}),
project:()=>{const p=cur(),t=total(p),b=brk(t),T=['خلاصه','هزینه‌ها','مصالح','پیمانکاران'];let x;
if(S.tab==0)x=`<div class="c row"><div><b>مرحله فعلی</b><div class="mu">${ST[p.stage]}</div><div class="mu" style="margin-top:4px">برآورد مصالح و هزینه‌ها</div></div><div class="ring" style="background:conic-gradient(var(--pr) ${p.pct}%,var(--li) 0)"><b>${fa(p.pct)}٪</b></div></div><a class="btn o" onclick="go('calc')">مشاهده جزئیات</a><a class="btn" style="margin-top:10px" onclick="nextSt()">تکمیل مرحله ✓</a><div style="margin-top:12px">${ST.map((s,i)=>`<div class="st"><div class="dot ${i<p.stage?'d':i==p.stage?'c':''}">${i<p.stage?'✓':fa(i+1)}</div>${s}</div>`).join('')}</div>`;
else if(S.tab==1)x=`<div class="c">${[['مصالح',b.m],['دستمزد',b.l],['سایر هزینه‌ها',b.o]].map(r=>`<div class="row" style="padding:8px 0"><span class="mu">${r[0]}</span><b>${fa(r[1])} تومان</b></div>`).join('')}</div>`;
else if(S.tab==2)x=M.slice(0,3).map((m,i)=>`<a class="c it" onclick="S.mat=${i};go('compare')"><div class="th ${m[4]}"></div><div class="g"><b>${m[0]}</b><div class="pr">${fa(m[2])} تومان / ${m[1]}</div></div></a>`).join('');
else x=C.slice(0,2).map(cc).join('');
return{n:1,h:`${pageTop('پروژه: '+p.name)}<div class="mu" style="margin-top:-6px">📍 ${esc(p.city)} · ${fa(p.floors)} طبقه · ${fa(p.area)} مترمربع</div><div class="tabs">${T.map((t,i)=>`<a class="${S.tab==i?'on':''}" onclick="stab(${i})">${t}</a>`).join('')}</div>${x}<div class="tot"><span class="mu">هزینه کل تقریبی</span><br><b>${fa(t)} تومان</b></div>`}},
prices:()=>({n:1,h:`${pageTop('قیمت مصالح')}<p class="mu">قیمت‌ها نمونه و صرفاً نمایشی هستند و قیمت روز محسوب نمی‌شوند.</p>${srch('جستجوی مصالح...',S.q,'sq')}${chips(CATS,S.cat,'sc')}<div id="lst">${mlist()}</div>`}),
compare:()=>{const m=M[S.mat],iron=m[3]=='آهن‌آلات',SZ=iron?['سایز ۱۴','سایز ۱۶','سایز ۱۸']:['استاندارد','ممتاز','اقتصادی'],f=[1,1.02,.97][S.sz],rows=BR.filter(b=>S.br=='همه'||b[0]==S.br),mn=Math.min(...rows.map(b=>b[1]));
return{n:1,h:`${pageTop('مقایسه قیمت '+m[0])}<div class="row"><select class="in" onchange="S.sz=this.selectedIndex;R(1)">${SZ.map((s,i)=>`<option ${S.sz==i?'selected':''}>${s}`).join('')}</select><select class="in" onchange="S.br=this.value;R(1)"><option>همه</option>${BR.map(b=>`<option ${S.br==b[0]?'selected':''}>${b[0]}`).join('')}</select></div><div class="c"><table><tr><th>برند<th>قیمت (تومان/${m[1]})<th>موجودی</tr>${rows.map(b=>{const pr=m[2]*b[1]*f;return`<tr><td>${b[0]}<td>${fa(pr)}${b[1]==mn?' <span class="ok">★</span>':''}<td class="${b[2]=='موجود'?'ok':b[2]=='کم'?'wr':'no'}">${b[2]}</tr>`}).join('')}</table></div><p class="mu">★ ارزان‌ترین · قیمت‌ها نمایشی هستند</p><a class="btn" onclick="toast('این قابلیت در نسخه نمایشی فعال نیست')">درخواست خرید</a>`}},
calc:()=>{const c=S.cl,ta=c.mode?c.area*c.fl:c.area,t=ta*RATE[c.struct],b=brk(t);return{n:1,h:`${pageTop('برآورد هزینه ساخت')}<div class="seg"><a class="${c.mode==0?'on':''}" onclick="S.cl.mode=0;S.cl.res=0;R(1)">مترمربع</a><a class="${c.mode==1?'on':''}" onclick="S.cl.mode=1;S.cl.res=0;R(1)">متراژ کل</a></div><label>${c.mode?'متراژ هر طبقه (مترمربع)':'متراژ (مترمربع)'}</label><input class="in" inputmode="numeric" value="${fa(c.area).replace(/٬/g,'')}" oninput="S.cl.area=num(this.value);S.cl.res=0"><label>نوع سازه</label><select class="in" onchange="S.cl.struct=this.value;S.cl.res=0">${Object.keys(RATE).map(k=>`<option ${c.struct==k?'selected':''}>${k}`).join('')}</select><label>تعداد طبقات</label><select class="in" onchange="S.cl.fl=+this.value;S.cl.res=0">${[1,2,3,4,5].map(n=>`<option value="${n}" ${c.fl==n?'selected':''}>${fa(n)}`).join('')}</select><a class="btn" onclick="S.cl.res=1;R(1)">محاسبه هزینه</a>${c.res?`<div class="res"><span class="mu">هزینه تقریبی کل (نمایشی)</span><div class="big">${fa(t)} تومان</div>${[['مصالح',b.m],['دستمزد',b.l],['سایر هزینه‌ها',b.o]].map(r=>`<div class="row mu" style="padding:3px 0"><span>${r[0]}</span><b>${fa(r[1])}</b></div>`).join('')}</div>`:''}`}},
contractors:()=>({n:3,h:`${pageTop('پیمانکاران نمونه')}${srch('جستجوی پیمانکار...',S.cq,'cq')}${chips(CT,S.cs,'cs')}<div id="lst">${clist()}</div>`}),
cp:i=>{const c=C[i];return{n:3,h:`${pageTop('پروفایل پیمانکار')}<div class="c row"><div><b>${c[0]}</b><div>${star(c[2])}</div><div class="mu">${c[4]} سال سابقه</div></div><div class="th">🏗</div></div><div class="chips">${CT.slice(1).map(x=>`<a class="${x==c[1]?'on':''}">${x}</a>`).join('')}</div><div class="stat"><div><b>${c[3]}</b><span class="mu">پروژه</span></div><div><b>${c[4]}</b><span class="mu">سال</span></div><div><b>۲۰</b><span class="mu">کیلومتر</span></div></div><b>نمونه پروژه‌ها</b><div class="pj"><div>🏠</div><div>🏡</div><div>🏘️</div></div><a class="mu" style="color:var(--pr);display:block;text-align:center;margin-bottom:12px" onclick="toast('نمایشی')">مشاهده همه پروژه‌ها</a><a class="btn" onclick="toast('این قابلیت در نسخه نمایشی فعال نیست')">درخواست مشاوره</a>`}},
guide:()=>({n:0,h:`${pageTop('راهنمای ساخت و ساز')}${srch('جستجوی آموزش...',S.gq,'gq')}<div class="qk"><a onclick="$('#stg').scrollIntoView({behavior:'smooth'})"><i>🪜</i>مراحل ساخت</a><a onclick="go('prices')"><i>🧱</i>مصالح</a><a onclick="toast('نکته: همیشه چند قیمت بگیرید 💡')"><i>💡</i>نکات مهم</a><a onclick="go('faq')"><i>❓</i>سؤالات</a></div><b>مقالات پیشنهادی</b><div id="lst" style="margin-top:8px">${alist()}</div><b id="stg">مراحل ساخت</b>${ST.map((s,i)=>`<details><summary>${fa(i+1)}. ${s}</summary><p>برای این مرحله با پیمانکار و مهندس ناظر هماهنگ کنید و هزینه را در بیلتو ثبت کنید.</p></details>`).join('')}`}),
faq:()=>({n:0,h:`${pageTop('سوالات متداول')}${srch('جستجوی سوال...',S.fq,'fq')}<div id="lst">${flist()}</div>`}),
projects:()=>({n:2,h:`${pageTop('پروژه‌های من')}<a class="btn" style="margin-bottom:14px" onclick="go('new')">+ پروژه جدید</a>${S.projects.map(p=>`<a class="c" onclick="S.cur=${p.id};S.tab=0;go('project')"><div class="row"><b>${esc(p.name)}</b><span class="tag">${p.type}</span></div><div class="mu">${esc(p.city)} · ${fa(p.area)} مترمربع</div><div style="height:8px;background:var(--li);border-radius:8px;overflow:hidden;margin:8px 0"><i style="display:block;height:100%;width:${p.pct}%;background:var(--pr)"></i></div><span class="mu">${ST[p.stage]} · ${fa(p.pct)}٪</span></a>`).join('')}`}),
profile:()=>({n:4,h:`${pageTop('')}<div class="ctr"><div class="av">🙂</div><b>محمد</b><div class="mu">mohammad@gmail.com</div></div><div class="ls" style="margin-top:10px">${[['settings','👤 اطلاعات حساب کاربری'],['projects','📁 پروژه‌های من'],['notif','🔔 تنظیمات اعلان‌ها'],['support','🎧 پشتیبانی'],['faq','ℹ️ درباره بیلتو']].map(x=>`<a onclick="go('${x[0]}')"><span>${x[1]}</span><span class="mu">›</span></a>`).join('')}</div><a style="display:block;text-align:center;color:#e03a3a;margin-top:16px" onclick="S.in=0;go('landing')">خروج از حساب ⎋</a>`}),
settings:()=>({n:4,h:`${pageTop('اطلاعات حساب')}<label>نام</label><input class="in" value="محمد"><label>ایمیل</label><input class="in" value="mohammad@gmail.com" style="direction:ltr;text-align:left"><label>موبایل</label><input class="in" value="۰۹۱۲۰۰۰۰۴۵۶"><a class="btn" onclick="toast('ویرایش حساب در نسخه نمایشی فعال نیست')">ذخیره تغییرات</a>`}),
support:()=>({n:4,h:`${pageTop('پشتیبانی')}<label>موضوع</label><input class="in"><label>پیام</label><input class="in" style="height:100px"><a class="btn" onclick="toast('ارسال پیام در نسخه نمایشی فعال نیست')">ارسال</a><p class="mu ctr" style="margin-top:16px">📞 ۰۲۱-۰۰۰۰۰۰۰۰ · ✉️ support@builto.example</p>`}),
notif:()=>({n:0,h:`${pageTop('اعلان‌ها')}${['🧱 قیمت میلگرد به‌روزرسانی شد (نمایشی)','✅ مرحله فونداسیون در حال انجام است','👷 پیمانکار جدید در شهر شما ثبت شد'].map(t=>`<div class="c">${t}<div class="mu">امروز</div></div>`).join('')}`}),
menu:()=>({full:1,dark:1,h:`<div class="dr"><div class="row">${L(1)}<a onclick="go('${S.in?'dash':'landing'}')" style="padding:0;border:0;font-size:22px">✕</a></div><div style="margin-top:16px">${[['dash','🏠','خانه'],['prices','🧱','قیمت مصالح'],['calc','🧮','برآورد هزینه'],['contractors','👷','پیمانکاران'],['guide','📖','راهنما'],['projects','📁','پروژه‌های من'],['settings','⚙️','تنظیمات'],['support','🎧','پشتیبانی']].map(x=>`<a onclick="S.in=1;go('${x[0]}')">${x[1]} ${x[2]}</a>`).join('')}</div><div class="pm">ساخت بهتر<br>با بیلتو 🏠</div></div>`})};
function chk(w){const v=$('#ph')?num($('#ph').value.replace(/\D/g,'')).toString():'';
if(w=='otp'){S.in=1;return go('onboard')}
if(String(($('#ph').value||'').replace(/[^\d۰-۹]/g,'')).length<10)return toast('شماره موبایل را وارد کنید (نمایشی: هر ۱۱ رقم)');
go(w=='signup'?'otp':'dash');if(w=='login')S.in=1}
function addP(){const id=Date.now();S.projects.push({id,name:$('#n').value||'پروژه جدید',type:S.type,city:$('#c').value,area:num($('#a').value)||100,floors:num($('#f').value)||1,stage:0,pct:5,struct:'سازه بتنی'});S.cur=id;S.tab=0;toast('پروژه ایجاد شد ✓');go('project')}
function nextSt(){const p=cur();if(p.stage<7){p.stage++;p.pct=Math.min(100,p.pct+10);toast('مرحله تکمیل شد ✓')}else toast('پروژه تمام شده است 🎉');R(1)}
function R(keep){save();const h=(location.hash||'#landing').slice(1);const r=h.startsWith('cp')?P.cp(+h.slice(2)):(P[h]||P.landing)();const pg=$('#pg'),y=keep?pg.scrollTop:0;pg.dataset.page=h;
pg.innerHTML=r.h;pg.style.padding=r.full?(r.dark?'0':'0'):'';if(r.full&&!r.dark&&h!='landing'){pg.style.padding='16px 18px'}
const nv=$('#nv');nv.style.display=r.n==null?'none':'flex';
if(r.n!=null)nv.innerHTML=`<a onclick="go('dash')" class="${r.n==0?'on':''}"><span>🏠</span>خانه</a><a onclick="go('prices')" class="${r.n==1?'on':''}"><span>🧱</span>مصالح</a><a class="pl" onclick="go('new')">+</a><a onclick="go('contractors')" class="${r.n==3?'on':''}"><span>👷</span>پیمانکاران</a><a onclick="go('profile')" class="${r.n==4?'on':''}"><span>👤</span>پروفایل</a>`;
pg.scrollTop=y}
addEventListener('hashchange',()=>R());addEventListener('pagehide',save);R();
</script></body></html>
